server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ai_review
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # 序列化 Date/Instant 时统一用东八区，与容器 TZ 保持一致；LocalDateTime 本身不带时区，
  # 由容器 TZ 决定其取值。
  jackson:
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 210MB

  lifecycle:
    timeout-per-shutdown-phase: 5s

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # Let PostgreSQL JDBC parse the complete script so dollar-quoted DO blocks
      # are not incorrectly split at their internal semicolons by Spring.
      separator: "^^^ END OF SCRIPT ^^^"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT Configuration
jwt:
  secret: Y2hhbmdlLXRoaXMtdG8tYS1zZWN1cmUtcmFuZG9tLWtleS1pbi1wcm9kdWN0aW9uLWF0LWxlYXN0LTI1Ni1iaXRz
  access-token-expiration: 3600000      # 1 hour
  refresh-token-expiration: 604800000   # 7 days

# File upload storage
file:
  upload-dir: ./uploads
  rules-dir: ./uploads/rules
  documents-dir: ./uploads/documents

# Async thread pool
async:
  core-pool-size: 4
  max-pool-size: 8
  queue-capacity: 100
  thread-name-prefix: review-task-

# AI review
review:
  retry:
    # 4 次尝试 = 3 次重试，节奏 1s → 2s → 4s 指数退避（总等待 7s）。
    # 比之前 5 次 × 6s = 24s 大幅缩短，但仍能吸收常见的瞬时抖动。
    # callWithRetry 只对 IOException / HTTP 5xx / 429 重试；4xx 立即失败。
    max-attempts: 4
    interval-ms: 1000
  chunk:
    max-tokens: 25600
    overlap-tokens: 0
    # 通用章节段的结束章节号（含）。0 = 自动识别：取「第一个试验项目章节」之前的全部章节
    # （含封面/目录等前置内容）合并为一个切片，让签署完整性、目录与正文一致性、术语一致性
    # 这类跨章检查能在同一次调用里完成。试验项目章节仍保持一章一片。
    # 仅当试验概述写法不规范、提不出试验项目清单导致自动识别失败时，才需要手动指定章节号。
    general-section-end-chapter: 0
    # 注入单次调用的「审查规则清单」段的 token 上限。超限的规则会被静默跳过（只留一行
    # 日志），因此宁可调大也不要为迁就上限压缩判据——判据写不全才真正影响审查准确性。
    # 参考：单章正文最大约 7000 token，固定提示词段约 2000，主流模型上下文 128K。
    rule-budget-tokens: 16000
  document:
    # 文档级综合审查的「单批规则」预算，与上面逐章的 rule-budget-tokens 分开。
    # 两者约束对象不同：逐章预算超了会丢规则；这里超了是拆批，一条不丢。
    # 真正的瓶颈在输出——模型输出预算按检查项数量在 8192~24576 token 间动态调整，
    # 但文档级规则要逐行列出跨章核对结果，十几条规则挤在一批仍可能写不完、JSON 被截断。
    # 因此本值要显著小于逐章预算，
    # 用批数换输出余量。实测 14 条文档级规则（11543 token）按 4000 会分成 4 批。
    rule-budget-tokens: 4000
    # 文档级综合审查（document_specific 规则）一次能带的原文字符数。
    # 跨章一致性判定要求证据包同时装下完整章节目录与足够多章节的开头，否则没进证据的
    # 章节等于没审。实测 37 章试验大纲：18000 只覆盖 16 章（含 10 个试验章）、40000
    # 覆盖 30 章（24 个试验章）、55000 才全覆盖 38 章（实耗 48300 字符）。
    # 该值是上限而非固定开销——文档小时按实际用量截止，不会白花 token。
    max-evidence-chars: 55000
  parallel:
    # 单个文档内切片并发调用 AI 的最大并发数。AI 调用以网络等待为主，
    # 提高并发可线性缩短审查耗时；上限由模型提供方的 RPM/并发配额决定。
    # chunkReviewExecutor 池子大小 = 此值 × async.max-pool-size，会自动跟随，
    # 因此调这一处即可，不需要动 AsyncConfig。
    chunk-concurrency: 6
    # 跨任务的出站调用总闸门。0（或负数）= 关闭，各任务并发相互独立：
    # 每个任务各自享有上面的 chunk-concurrency 个并发，别的任务在跑不会拖慢自己。
    #
    # 曾经设为 8（全任务共享且公平排队），后果是单任务能开 6 并发、两个任务同时跑
    # 却只有 8（不是 12），三个任务时每个实际只剩约 2.7，且后发任务要排在先发任务
    # 已入队的 acquire 之后 —— 表现为「另一个文档一审查，我这个就明显变慢」。
    #
    # 仅当上游按账号（而非按任务）限流、多任务并行频繁 429 时，才改回正数。
    # 届时它是额外的总闸门，不改变单任务上限。
    global-ai-concurrency: 0
  dispatch:
    # 【已废弃，默认关闭】一级章节号不大于该值时，仅执行内置文字质量检查，不注入业务规则。
    # 该档位在 dispatchForChunk 最开头就 return，会绕过全部规则元数据——你给第 3 章配的
    # 专项规则不管配得多准都不会生效，日志里只留一条 basic_chapter_profile，很难察觉。
    # 其职能已被「通用章节段合并 + general_chapter 规则类型」取代：前半部分通用章节现在
    # 合并成一片统一审查，用规则类型而不是章节号来区分该跑什么。
    # 保留配置项仅为兼容旧部署；设为非 0 会重新启用该档位（不推荐），且对通用段合并片无效。
    basic-only-max-chapter: 0
  rag:
    # 注：enabled / fallback-to-legacy 已废弃（RAG 与 CHUNK 现在通过前端侧边栏二选一
    # 进入，两条管线物理隔离、独立运行）。保留下面的 RAG 调参以便 RagReviewService
    # 复用同一组 review.rag.* 配置。
    check-concurrency: 4
    failed-check-retry-attempts: 1
    block-max-chars: 1800
    embedding-batch-size: 24
    # 成本/召回平衡调参（仅嵌入 + pgvector 检索，不耗 chat token）：
    #   recall-top-k        向量召回候选数（可适当大）
    #   evidence-max-blocks rerank 后送入分组评估的证据块上限（每检查项）
    recall-top-k: 30
    evidence-max-blocks: 10
    # 分组评估（按章节聚合检查项、一次调用评估多项）—— 把"每检查项一次调用、原文重发 N 遍"
    # 降到"每章节一次调用、原文发一遍"，是 RAG 降 token 的核心。
    #   max-checks-per-call  一次调用最多评估多少个检查项（越大越省，受 max_tokens 约束）
    #   max-evidence-per-call 一次调用共享的证据块上限（去重后按召回分取前 N）
    max-checks-per-call: 8
    max-evidence-per-call: 16
    # 两阶段复核：对每条非 Pass 违规再各发一次 AI 复判，仅给"已确认/待定"标签，
    # 对召回毫无帮助，却会让 AI 调用数翻数倍（N 条问题 = N 次额外调用）。
    # 默认关闭以控制成本；确需精度标注时再手动开。
    verify:
      enabled: false
    vector-index:
      enabled: true
      hnsw-ef-search: 100
      binary-candidate-multiplier: 4
  # SAR（结构化精准审查）管线参数 —— 与 RAG/CHUNK 物理隔离的第三套方案。
  # 引擎：三路并联路由(结构+词法+语义) → 区域级取证 → 清单式缺失检测 → 自适应复核 → 跨章一致性。
  sar:
    check-concurrency: 4
    failed-check-retry-attempts: 1
    block-max-chars: 1800
    embedding-batch-size: 24
    recall-top-k: 30                  # 语义路由的向量召回候选数
    evidence-max-blocks: 10           # 三路皆未命中时的回退取证块数
    max-checks-per-call: 8            # 同区域检查项分组的箱容量
    max-evidence-per-call: 16         # 单次分组调用的证据块上限
    region-max-blocks: 14             # 区域级取证：命中区域送入模型的整段块数上限
    route-confidence-threshold: 0.45  # 低于此路由置信度 → 降级 needs_review、优先复核
    verify:
      enabled: false                 # 自适应复核总开关（默认关；开启≈每条不确定违规多一次调用）
      adaptive: true                 # 仅复核低置信/定位不确定项（而非全量）
    consistency:
      enabled: true                  # 跨章一致性核对（抽取关键实体、查跨章节矛盾）
      max-input-chars: 48000         # 一致性摘要总字符预算，按章节公平分配
      per-chapter-max-chars: 4800    # 单章最多进入一致性模型的字符数
      windows-per-chapter: 4         # 长章节从头/中/尾等位置均匀取样
    quality:
      call-timeout-seconds: 120      # 文字质量单次模型调用上限；不超过模型自身 timeout
      full-scan:
        enabled: true                # 文字质量主线：全文切片扫描（错别字、病句、标点等局部问题）
        batch-blocks: 4              # 每次模型调用扫描多少个原文块
        concurrency: 2               # 单个任务的扫描并发；两个同时审查时避免串行超时累积
        failure-threshold: 4         # 累计失败达到阈值后停止继续调用，剩余批次标记人工复核
        max-blocks: 0                # 0=扫描全部；大文档压测时可临时限流
      structure-index:
        enabled: true                # 图号/表号唯一性、引用、顺序、完整性等确定性索引检查
      terminology:
        enabled: true                # 全文术语/缩写/设备称谓一致性审查
        max-observations: 160        # 术语索引送入模型的最大观察条数
    vector-index:
      enabled: true
      hnsw-ef-search: 100
      binary-candidate-multiplier: 4

logging:
  level:
    com.aireview: DEBUG
    com.baomidou.mybatisplus: DEBUG
